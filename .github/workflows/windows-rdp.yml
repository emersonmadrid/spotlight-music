name: Windows Remote Desktop (RDP)

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duración de la sesión en minutos (máximo 360)'
        required: true
        default: '120'

jobs:
  rdp:
    name: Start Windows RDP Session
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Precompilar Spotlight Music
        run: |
          pip install pyinstaller -r requirements.txt
          pyinstaller --noconfirm --onefile --windowed --name SpotlightMusic main.py
          
          # Crear carpeta en el Escritorio con la aplicación lista
          $desktop = [Environment]::GetFolderPath('Desktop')
          $appDir = Join-Path $desktop "SpotlightMusic"
          New-Item -ItemType Directory -Path $appDir -Force
          Copy-Item "dist\SpotlightMusic.exe" -Destination $appDir
          Copy-Item "install_windows.bat" -Destination $appDir
          Copy-Item "README.md" -Destination $appDir

          # Crear acceso directo en el Escritorio
          $WshShell = New-Object -ComObject WScript.Shell
          $shortcutPath = Join-Path $desktop "Spotlight Music.lnk"
          $Shortcut = $WshShell.CreateShortcut($shortcutPath)
          $exePath = Join-Path $appDir "SpotlightMusic.exe"
          $Shortcut.TargetPath = $exePath
          $Shortcut.WorkingDirectory = $appDir
          $Shortcut.Save()

          # Instalar mpv para que la reproducción de audio esté lista
          winget install --id shinchiro.mpv --silent --accept-source-agreements --accept-package-agreements 2>$null

      - name: Activar Escritorio Remoto (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 0
          net user runneradmin "Spotlight2026!"

      - name: Iniciar Túnel Bore (Puerto 3389 RDP)
        run: |
          Invoke-WebRequest https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath .
          
          # Iniciar bore en segundo plano redirigiendo logs
          $proc = Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "bore.log" -RedirectStandardError "bore.err" -PassThru
          Start-Sleep -Seconds 5
          
          $log = Get-Content bore.log -Raw
          Write-Host "Log de Bore:"
          Write-Host $log
          
          if ($log -match 'remote_port=(\d+)') {
              $port = $matches[1]
              $rdp_host = "bore.pub:$port"
              
              Write-Host ""
              Write-Host "==========================================================" -ForegroundColor Green
              Write-Host "🎉 ESCRITORIO REMOTO DE WINDOWS INICIADO CON ÉXITO!" -ForegroundColor Green
              Write-Host "==========================================================" -ForegroundColor Green
              Write-Host "Dirección RDP : $rdp_host" -ForegroundColor Yellow
              Write-Host "Usuario       : runneradmin" -ForegroundColor Yellow
              Write-Host "Contraseña    : Spotlight2026!" -ForegroundColor Yellow
              Write-Host "==========================================================" -ForegroundColor Green
              Write-Host "Comando para conectar desde tu Linux:" -ForegroundColor Cyan
              Write-Host "wlfreerdp /v:$rdp_host /u:runneradmin /p:Spotlight2026! /cert:ignore" -ForegroundColor White
              Write-Host "==========================================================" -ForegroundColor Green
              
              # Guardar en el Summary de GitHub para verlo en la web
              "### 🖥️ Datos de Conexión a la Máquina Windows" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "- **Servidor RDP:** \`$rdp_host\`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "- **Usuario:** \`runneradmin\`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "- **Contraseña:** \`Spotlight2026!\`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "**Comando para tu terminal de Linux:**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "\`\`\`bash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "wlfreerdp /v:$rdp_host /u:runneradmin /p:Spotlight2026! /cert:ignore" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "\`\`\`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
              Write-Host "Error al obtener el puerto de Bore" -ForegroundColor Red
              exit 1
          }

      - name: Mantener sesión RDP activa
        run: |
          $minutes = [int]"${{ github.event.inputs.duration_minutes }}"
          if ($minutes -le 0) { $minutes = 120 }
          $seconds = $minutes * 60
          Write-Host "Sesión RDP activa durante $minutes minutos... Puedes cancelarla en cualquier momento desde GitHub."
          Start-Sleep -Seconds $seconds
