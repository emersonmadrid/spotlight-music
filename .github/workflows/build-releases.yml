name: Build and Release Executables

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: dist_release/*
            asset_name: SpotlightMusic-Windows
          - os: ubuntu-latest
            artifact_name: dist_release/*
            asset_name: SpotlightMusic-Linux
          - os: macos-latest
            artifact_name: dist_release/*
            asset_name: SpotlightMusic-macOS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev gir1.2-gtk-3.0 python3-gi python3-gi-cairo

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Run Automated Test Suite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y mpv
          python test_suite.py

      - name: Build with PyInstaller and Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon spotlight.ico --add-data "spotlight.ico;." --add-data "spotlight.png;." --name SpotlightMusic main.py
          
          # Crear carpeta interna engine para el motor de audio mpv
          New-Item -ItemType Directory -Force -Path dist\engine
          
          # Descargar motor de audio mpv portable para Windows y guardarlo en engine/
          curl.exe -sL https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261019/mpv-x86_64-20261019-git-6a262d11f6.7z -o mpv.7z
          7z e mpv.7z mpv.exe -odist\engine -y
          Remove-Item mpv.7z -ErrorAction SilentlyContinue

          # Incluir vulkan-1.dll y yt-dlp.exe dentro de engine/
          Copy-Item bin\windows\vulkan-1.dll -Destination dist\engine\vulkan-1.dll
          curl.exe -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o dist\engine\yt-dlp.exe
          Copy-Item spotlight.ico -Destination dist\spotlight.ico
          Copy-Item spotlight.png -Destination dist\spotlight.png

          # Compilar el Instalador Visual con Inno Setup
          New-Item -ItemType Directory -Force -Path dist_installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

          # Preparar carpeta de salida para release
          New-Item -ItemType Directory -Force -Path dist_release
          Copy-Item dist_installer\SpotlightMusic_Setup.exe -Destination dist_release\SpotlightMusic_Setup.exe

          # Crear paquete portable (Zero loose yt-dlp.exe, motor mpv limpio en engine/)
          Compress-Archive -Path dist\SpotlightMusic.exe, dist\engine, dist\spotlight.ico, README.md, LICENSE, DISCLAIMER.md -DestinationPath dist_release\SpotlightMusic-Windows-x64.zip

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --name spotlight-music main.py
          mkdir -p dist_release
          tar -czf dist_release/SpotlightMusic-Linux-x64.tar.gz -C dist spotlight-music

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onefile --name spotlight-music main.py
          mkdir -p dist_release
          tar -czf dist_release/SpotlightMusic-macOS-x64.tar.gz -C dist spotlight-music

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Publish Release with Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false

      - name: Update Rolling Release on Main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: "Spotlight Music - Última Versión Compilada (Rolling)"
          body: |
            ## 🎵 Descarga directa de ejecutables oficiales

            Cada vez que el código se modifica, GitHub compila y publica automáticamente estos ejecutables oficiales:

            * 🪟 **Windows (Instalador Asistente Visual):** [SpotlightMusic_Setup.exe](https://github.com/${{ github.repository }}/releases/download/rolling/SpotlightMusic_Setup.exe) *(Recomendado - Instalación en 2 clics con Siguiente, Siguiente)*
            * 📦 **Windows (Portable):** [SpotlightMusic-Windows-x64.zip](https://github.com/${{ github.repository }}/releases/download/rolling/SpotlightMusic-Windows-x64.zip) *(Sin instalación, descomprimir y ejecutar)*
            * 🐧 **Linux:** [SpotlightMusic-Linux-x64.tar.gz](https://github.com/${{ github.repository }}/releases/download/rolling/SpotlightMusic-Linux-x64.tar.gz)
            * 🍏 **macOS:** [SpotlightMusic-macOS-x64.tar.gz](https://github.com/${{ github.repository }}/releases/download/rolling/SpotlightMusic-macOS-x64.tar.gz)

            ---
            *Compilación automática generada por GitHub Actions para el commit `${{ github.sha }}`.*
          files: release-assets/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
